<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; the learning track is drawn as a workflow pipeline of connected nodes. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #15212c;
  --muted: #5a6977;
  --line: #d8dfe6;
  --accent: #2b55d9;
  --accent-soft: #e3e9fb;
  --amber: #b86e00;
  --amber-soft: #fbefd9;
  --good: #1d7a4f;
  --good-soft: #dcf1e5;
  --bad: #b3362b;
  --bad-soft: #f8e0dd;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --band: #2b55d9;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #17202a; --ink: #e6ecf1; --muted: #93a2b0; --line: #2a3643;
    --accent: #7d9cff; --accent-soft: #1f2b4d; --amber: #f0b45a; --amber-soft: #3a2c14;
    --good: #5fd39a; --good-soft: #16352a; --bad: #ff8a7d; --bad-soft: #3d1f1c;
    --band: #0f151b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --ink: #e6ecf1; --muted: #93a2b0; --line: #2a3643;
  --accent: #7d9cff; --accent-soft: #1f2b4d; --amber: #f0b45a; --amber-soft: #3a2c14;
  --good: #5fd39a; --good-soft: #16352a; --bad: #ff8a7d; --bad-soft: #3d1f1c;
  --band: #0f151b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) calc(64px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--band);
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 500; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.82rem; }
.eyebrow {
  font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
}
.wrap { max-width: 780px; margin: 0 auto; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
}
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin-right: auto;
}
.brand-mark { width: 28px; height: 28px; flex: none; border-radius: 7px; }
.install-tip {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 28px;
}
.install-tip img { width: 44px; height: 44px; border-radius: 10px; }
.install-tip p { font-size: 0.9rem; color: var(--muted); }
.install-tip b { color: var(--ink); font-weight: 600; }
.install-tip button { border: 0; background: transparent; color: var(--muted); font-size: 1.2rem; padding: 4px 8px; }
.nav { display: flex; gap: 4px; }
.nav a {
  text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font-size: 0.92rem;
}
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.theme-btn {
  width: 36px; height: 36px; display: grid; place-items: center; flex: none;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--ink);
}
.theme-btn:hover { border-color: var(--muted); }
.theme-btn svg { width: 18px; height: 18px; }
.xp-pill {
  display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.8rem;
  background: var(--amber-soft); color: var(--amber); padding: 5px 10px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); padding: 10px 16px;
  border-radius: 8px; font-weight: 500; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Home */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-bottom: 36px; }
.hero > div { min-width: 0; }
.hero p.lede { color: var(--muted); margin-top: 10px; max-width: 58ch; }
.level-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; min-width: 220px;
}
.level-card .level-name { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; margin: 2px 0 10px; }
.meter { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--amber); border-radius: 999px; transition: width .4s; }
.level-card .mono { color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; }
.stat { border-top: 2px solid var(--ink); padding-top: 8px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.88rem; }

.track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.track { list-style: none; margin: 0; padding: 0; position: relative; }
.track::before {
  content: ""; position: absolute; left: 17px; top: 24px; bottom: 24px; width: 2px;
  background: repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px);
}
.node { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-block: 8px; }
.node-port {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; z-index: 1;
  background: var(--surface); border: 2px solid var(--line);
  font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); align-self: start; margin-top: 14px;
}
.node.started .node-port { border-color: var(--accent); color: var(--accent); }
.node.done .node-port { background: var(--good); border-color: var(--good); color: var(--surface); }
.node-card {
  display: block; text-decoration: none; color: inherit; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  transition: border-color .15s, transform .15s;
}
.node-card:hover { border-color: var(--accent); transform: translateX(2px); }
.node-card .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.node-card p { color: var(--muted); font-size: 0.94rem; margin-top: 4px; }
.steps { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.chip {
  font-family: var(--font-mono); font-size: 0.72rem; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.chip.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip.partial { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
.tag { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }

/* Module view */
.back { display: inline-flex; gap: 6px; color: var(--muted); text-decoration: none; font-size: 0.9rem; margin-bottom: 16px; }
.back:hover { color: var(--ink); }
.mod-head { margin-bottom: 22px; display: grid; gap: 8px; }
.mod-head p { color: var(--muted); max-width: 62ch; }
.tabs {
  display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: 24px; overflow-x: auto;
}
.tabs button {
  flex: 1; border: 0; background: transparent; padding: 9px 12px; border-radius: 7px;
  display: flex; gap: 8px; align-items: center; justify-content: center; white-space: nowrap; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.tick { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; border: 1.5px solid currentColor; opacity: .55; }
.tick.on { background: var(--good); border-color: var(--good); color: var(--surface); opacity: 1; }

.lesson { display: grid; gap: 28px; }
.lesson section { display: grid; gap: 10px; }
.lesson section p, .lesson li { max-width: 66ch; }
.lesson ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.callout {
  border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--surface);
  display: grid; gap: 6px;
}
.callout.example { border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; }
pre.code {
  margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.55;
}
.takeaways { background: var(--accent-soft); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 10px; }
.done-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.done-bar p { color: var(--muted); font-size: 0.92rem; }

/* Quiz */
.quiz-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 16px; }
.quiz-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.dots { display: flex; gap: 5px; }
.dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.ok { background: var(--good); } .dots i.no { background: var(--bad); } .dots i.cur { background: var(--accent); }
.q-text { font-size: 1.12rem; font-weight: 500; }
.options { display: grid; gap: 8px; }
.option {
  text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
  padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
}
.option .key { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); padding-top: 2px; }
.option:hover:not(:disabled) { border-color: var(--accent); }
.option.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option:disabled { cursor: default; }
.feedback { border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.feedback.ok { background: var(--good-soft); } .feedback.no { background: var(--bad-soft); }
.feedback b { font-family: var(--font-display); }
.score-big { font-family: var(--font-display); font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }

/* Task */
.task { display: grid; gap: 20px; }
.brief { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 10px; }
.brief .client { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.checklist input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--good); }
textarea {
  width: 100%; min-height: 200px; resize: vertical; font: 0.95rem/1.55 var(--font-body);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
}
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { color: var(--muted); font-size: 0.86rem; }
details.model { border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; }
details.model summary { cursor: pointer; font-weight: 600; }
details.model[open] summary { margin-bottom: 10px; }
details.model .lesson { gap: 12px; }

/* Glossary */
.search {
  width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; margin: 16px 0 20px;
}
.gloss { display: grid; gap: 0; margin: 0; }
.gloss div { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.gloss dt { font-family: var(--font-mono); font-size: 0.86rem; font-weight: 500; padding-top: 2px; }
.gloss dd { margin: 0; color: var(--muted); min-width: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.92rem;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .hero { grid-template-columns: 1fr; }
  .level-card { min-width: 0; }
  .gloss div { grid-template-columns: 1fr; gap: 4px; }
  .nav a { padding: 6px 8px; }
  .tabs button { padding: 9px 8px; font-size: 0.9rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#home">
      <img class="brand-mark" src="icons/icon.svg" alt="" width="28" height="28">
      AI Consultant Academy
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-nav="home">Track</a>
      <a href="#glossary" data-nav="glossary">Glossary</a>
    </nav>
    <span class="xp-pill" id="xp-pill" title="Experience points">0 XP</span>
    <button class="theme-btn" id="theme-btn" type="button"></button>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------
   Course content
------------------------------------------------------------------- */
const MODULES = [
{
  id: "llm-basics",
  title: "How LLMs actually work",
  summary: "Tokens, context windows, temperature and why models hallucinate. The mental model every recommendation you make rests on.",
  minutes: 15,
  lesson: [
    { h: "Next-token prediction", p: [
      "A large language model (LLM) is trained to predict the next piece of text given everything before it. It does this one token at a time. A token is a chunk of text, roughly 3 to 4 characters of English, so 1,000 tokens is about 750 words.",
      "Everything impressive the model does, from summarising contracts to writing code, comes out of this one mechanism applied at enormous scale. That is why the way you frame the input matters so much: the model continues the pattern you give it."
    ]},
    { h: "The context window", p: [
      "The context window is the total number of tokens the model can see at once: your instructions, the documents you paste in, the conversation so far and its own answer. Anything outside the window does not exist for the model.",
      "Large windows let you pass whole reports, but cost and latency grow with input size, and accuracy on details buried in the middle of very long inputs can drop. Send what the task needs, not everything you have."
    ], ex: { label: "Cost back-of-envelope", code: "Invoice extraction, 2,000 invoices / month\n  input  ≈ 1,500 tokens per invoice\n  output ≈ 300 tokens per invoice\n  monthly ≈ 3.0M input + 0.6M output tokens\n→ multiply by the model's per-million-token price\n  and compare against hours of manual work saved" } },
    { h: "Temperature and determinism", p: [
      "Temperature controls how much randomness goes into choosing each token. Low values make answers more consistent; higher values make them more varied. For extraction, classification and anything a workflow depends on, keep it low. For brainstorming and copy variations, raise it.",
      "Even at low temperature, outputs are not guaranteed to be identical across runs. Design automations to validate outputs rather than assume them."
    ]},
    { h: "Why models hallucinate", p: [
      "The model produces text that is plausible, not text that is checked. When it lacks the facts, it can still produce a confident answer. This is called hallucination.",
      "You reduce it by giving the model the source material (grounding), asking it to cite where each claim comes from, allowing it to answer \"I don't know\", and checking outputs automatically where you can."
    ]},
    { h: "Choosing a model", p: [
      "Providers offer tiers: large models that reason better but cost more and respond slower, and small models that are fast and cheap. A good default is to prototype with a capable model, then test whether a smaller one passes the same test cases. Many production workflows mix tiers: a small model routes or classifies, a larger one handles the hard cases."
    ]}
  ],
  takeaways: [
    "LLMs predict the next token; your input shapes the pattern they continue.",
    "The context window is everything the model can see. Cost scales with tokens.",
    "Low temperature for workflows, higher for creative work.",
    "Ground the model in sources and validate outputs to manage hallucination.",
    "Pick the smallest model that passes your test cases."
  ],
  quiz: [
    { q: "A client wants to process 10,000 support emails per month with an LLM. What is the main driver of the running cost?", o: ["The number of users with access", "The number of tokens sent and generated", "The temperature setting", "The number of prompts written"], a: 1, e: "API pricing is per token, for input and output separately. Volume times average tokens per item gives you the cost estimate." },
    { q: "Which setting fits a workflow that extracts invoice numbers into a spreadsheet?", o: ["High temperature, for creativity", "Low temperature, plus validation of the output format", "Any temperature, since extraction is always exact", "The largest model available, with no checks"], a: 1, e: "Extraction needs consistency. Low temperature helps, and validating the format (e.g. a regex or schema check) catches the cases where it still goes wrong." },
    { q: "Why does an LLM sometimes state wrong facts confidently?", o: ["It is lying on purpose", "It generates plausible text and has no built-in fact check", "The context window was too small every time", "Temperature was set to zero"], a: 1, e: "Models optimise for plausible continuations. Without grounding in sources, plausible and true can diverge." },
    { q: "Roughly how many words is 1,000 tokens of English?", o: ["About 100", "About 750", "About 3,000", "Exactly 1,000"], a: 1, e: "A common rule of thumb is that one token is about three quarters of a word in English. Other languages often use more tokens per word." },
    { q: "What is a sensible way to choose a model for production?", o: ["Always use the biggest model", "Always use the cheapest model", "Prototype with a capable model, then test whether a smaller one passes the same test cases", "Choose based on which vendor has the best marketing"], a: 2, e: "Start with quality to prove the use case, then optimise cost and latency against a fixed test set." }
  ],
  task: {
    client: "Nordvik Logistics", role: "Operations director",
    brief: "Nordvik's operations director read that ChatGPT \"makes things up\" and is now hesitant to approve a pilot that summarises daily delivery-incident reports for the morning meeting. About 120 reports arrive per day, each around 400 words.",
    deliverables: [
      "Explain in plain language why hallucination happens (2 to 3 sentences, no jargon)",
      "List at least three concrete measures you would build in to reduce the risk",
      "Give a rough monthly token estimate for the summaries",
      "Recommend whether a large or small model should be tried first, and why"
    ],
    model: [
      "Plain explanation: the model writes the most likely-sounding text based on what it has been given. If information is missing, it can fill the gap with something that sounds right. If we give it the actual report and ask it to only use that, the risk drops sharply.",
      "Measures: (1) only summarise the attached report, never general knowledge; (2) require the summary to quote the incident ID and location from the source so it can be traced; (3) allow 'not stated in report' as an answer; (4) a supervisor reviews the summary for the first four weeks and logs errors; (5) low temperature.",
      "Tokens: 120 reports × ~530 input tokens (400 words) + ~150 output tokens ≈ 82k tokens per day, around 1.8M tokens per working month. That is a small cost on any current model.",
      "Model choice: start with a mid or large model to set a quality bar, then test a small model against 50 real reports. At this volume cost is minor, so quality should decide."

{
  id: "prompting",
  title: "Prompting that holds up in production",
  summary: "Turn one-off chat prompts into reliable specifications: structure, examples, output formats and test cases.",
  minutes: 18,
  lesson: [
    { h: "A prompt is a specification", p: [
      "In a chat window, a vague prompt is fine because you can follow up. In an automation, nobody follows up. The prompt has to work on the thousandth input as well as the first. Treat it like a brief to a new colleague who is very capable but knows nothing about the client."
    ]},
    { h: "The building blocks", p: [
      "Strong production prompts usually contain the same parts. Not every prompt needs all of them, but missing ones are the first place to look when output is poor."
    ], list: [
      "Role and goal: who the model is acting as and what the output is for.",
      "Context: the facts, documents and constraints it needs.",
      "Task: the exact steps, in order.",
      "Output format: a template, JSON schema or strict structure.",
      "Examples: one to three input-output pairs showing the edge cases.",
      "Rules for uncertainty: what to do when information is missing."
    ], ex: { label: "Example prompt skeleton", code: "You classify incoming customer emails for an insurance company.\nThe result routes the email to the right team.\n\n<categories>\nclaim_new | claim_status | policy_change | complaint | other\n</categories>\n\n<email>\n{{email_body}}\n</email>\n\nReturn only JSON:\n{\"category\": \"...\", \"confidence\": \"high|low\", \"reason\": \"one sentence\"}\nIf the email fits none of the categories, use \"other\" and confidence \"low\"." } },
    { h: "Examples beat adjectives", p: [
      "\"Write a concise, professional summary\" means different things to different readers. Showing one good example communicates length, tone and structure at once. This is called few-shot prompting. Choose examples that cover the tricky cases, not just the easy ones, and vary them so the model does not copy one too literally."
    ]},
    { h: "Structured output", p: [
      "When the result feeds another system, ask for JSON or another strict format, and use the provider's structured output or schema feature where it exists. Then validate the result in the workflow. If parsing fails, retry once or route the item to a person."
    ]},
    { h: "Test before you trust", p: [
      "Collect 20 to 50 real inputs, including awkward ones, and write down what a good output looks like for each. Every time you change the prompt, run the whole set. This turns prompt tweaking from guesswork into measurable improvement, and it is the same set you will use to compare models later."
    ]}
  ],
  takeaways: [
    "Write prompts as specifications a newcomer could follow.",
    "Role, context, task, format, examples and uncertainty rules.",
    "One good example says more than three adjectives.",
    "Use structured output and validate it in the workflow.",
    "Keep a test set and rerun it on every change."
  ],
  quiz: [
    { q: "An automation's prompt works for most emails but fails unpredictably on some. What should you do first?", o: ["Raise the temperature", "Collect the failing inputs into a test set and analyse what they have in common", "Switch vendor", "Add 'be accurate' to the prompt"], a: 1, e: "Failures are data. A test set lets you see the pattern and measure whether a change actually fixes it." },
    { q: "What is few-shot prompting?", o: ["Calling the API a few times and averaging", "Including a small number of example inputs and outputs in the prompt", "Using a small model", "Limiting the output length"], a: 1, e: "Few-shot means giving worked examples so the model can infer format, tone and edge-case handling." },
    { q: "The output of an LLM step will be written into a CRM. Which approach is most robust?", o: ["Ask for a friendly paragraph and parse it with regex", "Ask for JSON matching a schema, validate it, and route failures to a human", "Trust the output since the model is large", "Let the CRM handle any format"], a: 1, e: "Strict format, validation and a fallback path make the step dependable." },
    { q: "Which prompt instruction best handles missing information?", o: ["Always provide an answer", "If the document does not state the value, return null and say 'not found'", "Guess the most likely value", "Never mention uncertainty"], a: 1, e: "Giving the model an explicit, allowed way to say 'unknown' reduces invented values." },
    { q: "Why are vague adjectives like 'concise' and 'professional' weak instructions?", o: ["Models ignore adjectives", "They are interpreted differently; an example or a concrete limit is clearer", "They make prompts too long", "They increase cost a lot"], a: 1, e: "Concrete limits (\"max 3 bullet points\") and examples remove ambiguity." }

{
  id: "automation",
  title: "Automation building blocks",
  summary: "Triggers, actions, data mapping, webhooks and error handling, and how they look in tools like n8n, Make, Zapier and Power Automate.",
  minutes: 20,
  lesson: [
    { h: "Trigger, steps, result", p: [
      "Every automation follows the same shape. A trigger starts it (a new email, a form submission, a schedule). Steps transform data or call other systems. A result is written somewhere (a CRM record, a message, a file). AI is just another step in this chain, usually one that turns unstructured text into structured data or drafts text."
    ], ex: { label: "Workflow notation", code: "TRIGGER  new email in support@ inbox\n  → STEP   LLM: classify + extract order number   (JSON)\n  → IF     category == \"return\" AND order found\n      → STEP   look up order in Shopify API\n      → STEP   LLM: draft reply using order data\n      → RESULT create draft in helpdesk, tag \"ai-draft\"\n  → ELSE   RESULT assign to human queue" } },
    { h: "APIs, JSON and webhooks", p: [
      "Systems talk to each other through APIs, usually exchanging JSON: structured text made of keys and values. A webhook is a URL a system calls when something happens, so your workflow reacts instantly. Polling is the alternative: your workflow checks every few minutes whether anything is new. Webhooks are faster and cheaper; polling is the fallback when a system does not offer them.",
      "Authentication is usually an API key or OAuth connection. Treat keys like passwords: store them in the platform's credential store, never in a prompt or a shared document."
    ]},
    { h: "Choosing a platform", list: [
      "Zapier: easiest for non-technical teams, huge app catalogue, cost grows with task volume.",
      "Make: visual and flexible with data mapping, good value at medium volume.",
      "n8n: open source, can be self-hosted for data control, strong AI and code nodes, suits technical teams.",
      "Power Automate: natural fit for Microsoft 365 organisations and their governance.",
      "Custom code: when volume, logic or compliance outgrow the platforms."
    ], p: [
      "Pick based on the client's existing stack, who will maintain it, data residency needs and expected volume, not on what you personally prefer."
    ]},
    { h: "Design for failure", p: [
      "Real data is messy and APIs go down. Professional workflows handle this on purpose."
    ], list: [
      "Retries with a delay for temporary errors.",
      "An error path that notifies someone and stores the failed item.",
      "Idempotency: running the same item twice must not create two invoices.",
      "Logging inputs and outputs so you can debug and audit.",
      "Human review for low-confidence AI results."
    ]}
  ],
  takeaways: [
    "Trigger, steps, result. AI is one step in a larger flow.",
    "Webhooks react instantly; polling is the fallback.",
    "Keep credentials in the platform's credential store.",
    "Choose tools by the client's stack, skills, data needs and volume.",
    "Build retries, error paths, idempotency and logs from day one."
  ],
  quiz: [
    { q: "What is a webhook?", o: ["A scheduled job that runs every hour", "A URL that a system calls to notify your workflow when an event happens", "A type of AI model", "A browser extension"], a: 1, e: "Webhooks push events to you in real time, instead of you polling for changes." },
    { q: "A workflow sometimes runs twice on the same order and creates duplicate invoices. Which principle is missing?", o: ["Temperature", "Idempotency", "Few-shot prompting", "Tokenisation"], a: 1, e: "An idempotent step can run multiple times with the same result, for example by checking whether an invoice for that order ID already exists." },
    { q: "A client is a Microsoft 365 organisation with strict IT governance and no developers. What is a sensible first platform to evaluate?", o: ["A custom Python service", "Power Automate", "A self-hosted n8n cluster", "Spreadsheets with macros"], a: 1, e: "It fits their existing stack, licensing and admin controls, and can be maintained without developers." },
    { q: "Where should an API key for the client's CRM be stored?", o: ["In the prompt so the model can use it", "In a shared spreadsheet", "In the automation platform's credential store", "In the workflow's name"], a: 2, e: "Credential stores encrypt secrets and keep them out of logs, prompts and documents." },
    { q: "What should happen when the AI step returns low confidence?", o: ["Drop the item", "Route it to a human review queue", "Retry until confidence is high", "Write it to the CRM anyway"], a: 1, e: "Human-in-the-loop for uncertain cases keeps quality high while still automating the clear majority." }
  ],

    deliverables: [

      "Platform: Power Automate, because it is already licensed in their Microsoft 365 tenant and IT can govern it. AI Builder or an Azure OpenAI step handles extraction.",
      "Failures: scanned image with poor quality → OCR confidence low → queue. Totals do not add up → queue with the mismatch highlighted. Same invoice sent twice → check invoice number + supplier before creating, skip duplicates. API down → retry 3 times, then alert.",

{
  id: "rag",
  title: "Grounding AI in company knowledge",
  summary: "Retrieval-augmented generation (RAG): chunking, embeddings, search and citations. And when fine-tuning is the wrong answer.",
  minutes: 18,
  lesson: [
    { h: "The problem RAG solves", p: [
      "A model knows nothing about a client's internal handbooks, contracts or product data. Pasting everything into every prompt is slow and expensive and often does not fit. Retrieval-augmented generation (RAG) retrieves the few relevant passages for each question and passes only those to the model, with an instruction to answer from them."
    ]},
    { h: "How a RAG pipeline works", ex: { label: "Two phases", code: "INDEXING (once, then on change)\n  documents → split into chunks (e.g. 300–800 tokens)\n            → embed each chunk into a vector\n            → store vectors + text + metadata\n\nANSWERING (per question)\n  question → embed → find the most similar chunks\n           → (optional) rerank, filter by metadata\n           → prompt: question + chunks + \"answer only from these, cite sources\"\n           → answer with citations" }, p: [
      "An embedding is a list of numbers that represents the meaning of a text. Texts with similar meaning get similar vectors, so \"How many vacation days do I get?\" finds the chunk about \"annual leave entitlement\" even without shared words. Many systems combine this with keyword search (hybrid search) for names, codes and numbers."
    ]},
    { h: "Where RAG projects fail", list: [
      "Bad source content: outdated, duplicated or contradictory documents produce confident wrong answers.",
      "Poor chunking: a table split in half or a rule separated from its exception.",
      "Missing permissions: the assistant reveals HR documents to everyone.",
      "No citations: users cannot verify, so they stop trusting it.",
      "No evaluation: nobody measured whether answers were right."
    ], p: [
      "In practice, most of the work is content clean-up and access control, not the AI."
    ]},
    { h: "RAG or fine-tuning?", p: [
      "Fine-tuning changes the model's behaviour by training it on examples. It is good for teaching a consistent style or format, or a narrow task at high volume. It is a poor way to add facts that change, because you would need to retrain whenever they do and you lose the ability to cite sources. For knowledge, start with RAG. Consider fine-tuning only after prompting and RAG are exhausted."
    ]}
  ],
  takeaways: [
    "RAG retrieves relevant passages and asks the model to answer from them.",
    "Embeddings capture meaning; hybrid search adds exact matches.",
    "Content quality and permissions decide success more than the model.",
    "Always show citations so users can verify.",
    "Use RAG for knowledge, fine-tuning for behaviour or style."
  ],
  quiz: [
    { q: "A client's employee handbook changes every quarter. They want an assistant that answers policy questions. What approach fits?", o: ["Fine-tune a model on the handbook each quarter", "RAG over the current handbook, with citations", "Paste the handbook into the model's system prompt once and never update", "Train a model from scratch"], a: 1, e: "RAG lets you update the index when documents change and shows the source for each answer." },
    { q: "What is an embedding?", o: ["A secret API key", "A numeric vector representing the meaning of a text", "A compressed PDF", "A type of prompt template"], a: 1, e: "Embeddings let you compare texts by meaning using vector similarity." },
    { q: "The assistant answers HR salary questions for any employee who asks. What was missed?", o: ["Temperature", "Document-level access control in retrieval", "Chunk size", "A bigger model"], a: 1, e: "Retrieval must respect the user's permissions, so restricted documents are never retrieved for unauthorised users." },
    { q: "Why combine semantic search with keyword search?", o: ["It is required by law", "Keyword search catches exact terms like product codes and names that embeddings may miss", "It halves the cost", "It removes the need for chunking"], a: 1, e: "Hybrid search covers both meaning-based matches and exact identifiers." },
    { q: "Users say answers are 'confidently wrong'. Investigation shows three versions of the same policy in the index. What is the fix?", o: ["Switch to a larger model", "Clean up the source content and keep one authoritative version", "Increase temperature", "Remove citations"], a: 1, e: "Garbage in, garbage out. Content governance is part of every RAG project." }
  ],
  task: {
    client: "Havbris Hotels", role: "Head of guest services",
    brief: "Havbris runs 14 hotels. Front-desk staff spend a lot of time looking up answers in 600 pages of procedures, local guides and brand standards spread over SharePoint, PDFs and an old wiki. Some procedures differ per hotel. They want an internal assistant that answers staff questions.",
    deliverables: [
      "Describe the indexing and answering steps for this case",
      "Explain how you handle hotel-specific procedures",
      "List the content clean-up work needed before launch",
      "Define three ways you will check answer quality"
    ],
    model: [
      "Indexing: collect SharePoint, PDFs and wiki export → remove duplicates and outdated versions → chunk by section heading, keeping tables whole → attach metadata (hotel, document type, last updated, owner) → embed and store. Re-index nightly from SharePoint.",
      "Hotel-specific: the assistant knows which hotel the user works at (from their login). Retrieval filters to that hotel's documents plus brand-wide ones, and prefers hotel-specific chunks when both exist. Answers state which hotel the rule applies to.",
      "Clean-up: name an owner per document, archive old wiki pages, resolve contradictions between brand and local rules, convert scanned PDFs to text, add 'last reviewed' dates.",
      "Quality checks: a test set of 60 real staff questions with correct answers, scored before launch and after every change; thumbs up/down with comments in the interface; a weekly review of unanswered or low-rated questions with the content owners."
    ]
  }

{
  id: "agents",
  title: "Agents and tool use",
  summary: "When an AI should take actions, how tool calling works, and why a predictable workflow often beats a fully autonomous agent.",
  minutes: 16,
  lesson: [
    { h: "From answers to actions", p: [
      "Tool use (also called function calling) lets a model request an action: look up an order, search a database, send a message. You describe each tool with a name, a purpose and the inputs it takes. The model decides when to call one; your code executes it and returns the result to the model, which continues."
    ], ex: { label: "A tool definition", code: "{\n  \"name\": \"get_order_status\",\n  \"description\": \"Look up shipping status for one order. Use when the customer gives an order number.\",\n  \"input_schema\": {\n    \"type\": \"object\",\n    \"properties\": { \"order_id\": { \"type\": \"string\" } },\n    \"required\": [\"order_id\"]\n  }\n}" } },
    { h: "Workflow or agent?", p: [
      "In a workflow, you decide the steps in advance and the model fills in specific parts. In an agent, the model decides which steps to take, in a loop, until the goal is reached. Agents handle open-ended tasks well, but they are harder to predict, test and cost-control.",
      "Rule of thumb: if you can draw the process as a flowchart, build a workflow. Use an agent where the path genuinely varies case by case, such as research, troubleshooting or multi-system investigations."
    ]},
    { h: "Guardrails for agents", list: [
      "Least privilege: give read-only tools unless writing is needed.",
      "Approval steps before irreversible actions like payments, deletions or external emails.",
      "Limits on loop iterations, spend and time.",
      "Clear tool descriptions; most agent errors come from vague tools.",
      "Full logging of every tool call for audit and debugging."
    ]},
    { h: "Standard connectors", p: [
      "The Model Context Protocol (MCP) is an open standard for connecting AI applications to tools and data sources. Instead of building a custom integration for every model and every system, a system exposes an MCP server once and compatible AI clients can use it. For consultants, this means asking early whether the client's systems already offer MCP servers or APIs, since that drives integration effort."
    ]}
  ],
  takeaways: [
    "Tool use: the model requests actions; your code executes them.",
    "Workflows for known paths, agents for genuinely variable ones.",
    "Least privilege, approvals before irreversible actions, limits and logs.",
    "Good tool descriptions prevent most agent mistakes.",
    "MCP standardises how AI connects to tools and data."
  ],
  quiz: [
    { q: "In tool calling, who actually executes the action?", o: ["The language model itself", "Your application code, after the model requests it", "The end user", "The model provider's servers always"], a: 1, e: "The model outputs a structured request; your system runs the tool and returns the result." },
    { q: "A client wants to automate a fixed five-step onboarding process that never changes. What fits best?", o: ["A fully autonomous agent", "A deterministic workflow with AI in the steps that need it", "No automation", "Fine-tuning"], a: 1, e: "A known, fixed path is cheaper, more predictable and easier to test as a workflow." },
    { q: "An agent can issue refunds. Which guardrail matters most?", o: ["Higher temperature", "Human approval or a hard limit before the refund executes", "A longer system prompt", "More tools"], a: 1, e: "Irreversible financial actions need approvals or strict limits." },
    { q: "An agent keeps calling the wrong tool. What is the most likely first fix?", o: ["Switch to a smaller model", "Rewrite the tool names and descriptions to be clearer and distinct", "Remove logging", "Add more tools"], a: 1, e: "The model chooses tools from their descriptions. Ambiguous descriptions cause wrong choices." },
    { q: "What is MCP?", o: ["A billing model", "An open protocol for connecting AI applications to tools and data sources", "A type of vector database", "A GDPR requirement"], a: 1, e: "The Model Context Protocol standardises integrations between AI clients and external systems." }
  ],

      "Approval: create_return runs automatically only when eligibility returned true and the value is under a set threshold; otherwise it creates a ticket. No refund tool at all. Refunds stay with staff.",
      "Design: a mix. An intent classifier routes to fixed workflows for order status and returns, which are predictable. A constrained agent handles warranty questions where the path varies, with read-only tools plus create_ticket.",

{
  id: "governance",
  title: "Risk, privacy and governance",
  summary: "GDPR essentials, the EU AI Act risk tiers, prompt injection and the policies clients need before scaling AI.",
  minutes: 18,

const GLOSSARY = [
  ["Agent", "An AI system that decides its own next steps in a loop, using tools, until a goal is reached."],
  ["API", "Application Programming Interface. A defined way for software systems to exchange data and trigger actions."],
  ["Chunking", "Splitting documents into smaller passages so the most relevant ones can be retrieved and passed to a model."],
  ["Context window", "The maximum number of tokens a model can consider at once, including instructions, documents, conversation and its answer."],
  ["DPA", "Data Processing Agreement. A contract required under GDPR between an organisation and a vendor that processes personal data on its behalf."],
  ["DPIA", "Data Protection Impact Assessment. A GDPR assessment required for processing likely to result in high risk to individuals."],
  ["Embedding", "A list of numbers representing the meaning of a text, used to find similar texts by vector similarity."],
  ["EU AI Act", "EU regulation that classifies AI systems by risk (unacceptable, high, limited, minimal) with obligations for each tier."],
  ["Evaluation set", "Real inputs with known good outputs, used to measure quality before and after every change."],
  ["Few-shot prompting", "Including a few example inputs and outputs in a prompt to show the model the expected result."],
  ["Fine-tuning", "Further training a model on examples to change its behaviour, style or format. Not ideal for frequently changing facts."],
  ["Guardrails", "Rules and checks that limit what an AI system can do or output, such as approvals, filters and spending limits."],
  ["Hallucination", "When a model produces plausible but false or unsupported content."],
  ["Human-in-the-loop", "A design where a person reviews or approves AI output before it takes effect."],
  ["Hybrid search", "Combining semantic (embedding) search with keyword search to catch both meaning and exact terms."],
  ["Idempotency", "The property that running the same operation more than once has the same effect as running it once."],
  ["JSON", "A text format for structured data made of keys and values, used by most APIs."],
  ["LLM", "Large Language Model. A model trained on large amounts of text to predict and generate language."],
  ["MCP", "Model Context Protocol. An open standard for connecting AI applications to external tools and data sources."],
  ["Polling", "Checking a system at intervals for new data, as an alternative to webhooks."],
  ["Prompt injection", "Instructions hidden in content (emails, web pages, documents) that try to override a model's intended instructions."],
  ["RAG", "Retrieval-Augmented Generation. Retrieving relevant passages from a knowledge source and asking the model to answer from them."],
  ["Shadow AI", "Employees using unapproved AI tools for work, often with company data."],
  ["Structured output", "Model output in a strict machine-readable format such as JSON matching a schema."],
  ["Temperature", "A setting that controls randomness in a model's output. Lower is more consistent; higher is more varied."],
  ["Token", "A chunk of text a model processes, roughly three quarters of an English word on average."],
  ["Tool use", "Also called function calling. The model requests an action, your code executes it and returns the result."],
  ["Trigger", "The event that starts an automation, such as a new email, a form submission or a schedule."],
  ["Webhook", "A URL a system calls to notify another system immediately when an event happens."]
];

/* ------------------------------------------------------------------
   Progress state (saved in this browser only)
------------------------------------------------------------------- */
const STORE_KEY = "ai-consultant-academy-v1";
const XP = { lesson: 20, perCorrect: 10, task: 40 };
const LEVELS = [
  { min: 0, name: "Explorer" },
  { min: 150, name: "Practitioner" },
  { min: 400, name: "Consultant" },
  { min: 700, name: "Lead Consultant" }
];
const PASS_RATIO = 0.8;

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(blankState(), JSON.parse(raw));
  } catch (e) {}
  return blankState();
}
function blankState() { return { lessons: {}, quizBest: {}, tasks: {}, drafts: {}, checks: {} }; }
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
let state = loadState();

function quizPassed(m) { return (state.quizBest[m.id] || 0) >= Math.ceil(m.quiz.length * PASS_RATIO); }
function stepsDone(m) { return [!!state.lessons[m.id], quizPassed(m), !!state.tasks[m.id]]; }
function moduleDone(m) { return stepsDone(m).every(Boolean); }
function totalXP() {
  return MODULES.reduce((sum, m) =>
    sum + (state.lessons[m.id] ? XP.lesson : 0)
        + (state.quizBest[m.id] || 0) * XP.perCorrect
        + (state.tasks[m.id] ? XP.task : 0), 0);
}
function levelFor(xp) {
  let i = 0;
  LEVELS.forEach((l, idx) => { if (xp >= l.min) i = idx; });
  return { current: LEVELS[i], next: LEVELS[i + 1] || null };
}

/* ------------------------------------------------------------------
   Rendering helpers
------------------------------------------------------------------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function updateChrome(view) {
  document.getElementById("xp-pill").textContent = totalXP() + " XP";
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

/* ------------------------------------------------------------------
   Home: the learning track
------------------------------------------------------------------- */
function showInstallTip() {
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  return iOS && !standalone && !state.hideInstallTip && location.protocol.startsWith("http");
}

function renderHome() {
  const xp = totalXP();
  const { current, next } = levelFor(xp);
  const pct = next ? Math.round((xp - current.min) / (next.min - current.min) * 100) : 100;
  const doneCount = MODULES.filter(moduleDone).length;
  const quizzes = MODULES.filter(quizPassed).length;
  const tasks = MODULES.filter(m => state.tasks[m.id]).length;
  const nextMod = MODULES.find(m => !moduleDone(m));

  app.innerHTML = `
    ${showInstallTip() ? `
    <aside class="install-tip" id="install-tip">
      <img src="icons/apple-touch-icon.png" alt="">
      <p><b>Install on your iPhone.</b> Tap the Share button in Safari, then <b>Add to Home Screen</b>. The app then opens full screen and works offline.</p>
      <button type="button" id="install-dismiss" aria-label="Hide install tip">×</button>
    </aside>` : ""}
    <section class="hero">
      <div>
        <p class="eyebrow">Semi-beginner → intermediate · ${MODULES.length} modules</p>
        <h1>Learn to advise on AI and automation</h1>
        <p class="lede">Each module has a short lesson, a quiz with explanations and a client case to solve. Work through them in order, or jump to what you need.</p>
        <div class="btn-row" style="margin-top:18px">
          ${nextMod
            ? `<a class="btn primary" href="#module-${nextMod.id}">${doneCount ? "Continue" : "Start"}: ${esc(nextMod.title)}</a>`
            : `<span class="btn primary" aria-disabled="true">All modules complete</span>`}
        </div>
      </div>
      <aside class="level-card" aria-label="Your level">
        <p class="eyebrow">Your level</p>
        <p class="level-name">${current.name}</p>
        <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
        <p class="mono">${next ? `${xp} / ${next.min} XP to ${next.name}` : `${xp} XP · top level reached`}</p>
      </aside>
    </section>

    <section class="stats" aria-label="Progress">
      <div class="stat"><b>${doneCount}/${MODULES.length}</b><span>modules complete</span></div>
      <div class="stat"><b>${quizzes}/${MODULES.length}</b><span>quizzes passed</span></div>
      <div class="stat"><b>${tasks}/${MODULES.length}</b><span>client cases solved</span></div>
    </section>

    <div class="track-head">
      <h2>Learning track</h2>
      <span class="tag">lesson → quiz → case</span>
    </div>
    <ol class="track">
      ${MODULES.map((m, i) => {
        const s = stepsDone(m);
        const cls = moduleDone(m) ? "done" : s.some(Boolean) ? "started" : "";
        const best = state.quizBest[m.id];
        const quizChip = quizPassed(m) ? "done" : best != null ? "partial" : "";
        return `
        <li class="node ${cls}">
          <span class="node-port" aria-hidden="true">${moduleDone(m) ? "✓" : String(i + 1).padStart(2, "0")}</span>
          <a class="node-card" href="#module-${m.id}">
            <div class="row"><h3>${esc(m.title)}</h3><span class="tag">${m.minutes} min</span></div>
            <p>${esc(m.summary)}</p>
            <div class="steps">
              <span class="chip ${s[0] ? "done" : ""}">Lesson${s[0] ? " ✓" : ""}</span>
              <span class="chip ${quizChip}">Quiz${best != null ? ` ${best}/${m.quiz.length}` : ""}</span>
              <span class="chip ${s[2] ? "done" : ""}">Case${s[2] ? " ✓" : ""}</span>
            </div>
          </a>
        </li>`;
      }).join("")}
    </ol>
    <div class="done-bar" style="margin-top:28px">
      <p>Progress is saved in this browser only.</p>
      <button class="btn" id="reset-btn" type="button">Reset progress</button>
    </div>`;

  const dismiss = document.getElementById("install-dismiss");
  if (dismiss) dismiss.addEventListener("click", () => {
    state.hideInstallTip = true; saveState(); document.getElementById("install-tip").remove();
  });

  const resetBtn = document.getElementById("reset-btn");
  resetBtn.addEventListener("click", () => {
    if (resetBtn.dataset.confirm) {
      state = blankState(); saveState(); toast("Progress reset"); render();
    } else {
      resetBtn.dataset.confirm = "1";
      resetBtn.textContent = "Click again to confirm reset";
      setTimeout(() => { if (resetBtn.isConnected) { delete resetBtn.dataset.confirm; resetBtn.textContent = "Reset progress"; } }, 4000);
    }
  });
}

/* ------------------------------------------------------------------
   Module view
------------------------------------------------------------------- */
let currentTab = {};
let quizSession = null;

function renderModule(id) {
  const idx = MODULES.findIndex(m => m.id === id);
  if (idx < 0) { location.hash = "home"; return; }
  const m = MODULES[idx];
  const tab = currentTab[id] || "lesson";
  const s = stepsDone(m);
  const tabs = [["lesson", "Lesson", s[0]], ["quiz", "Quiz", s[1]], ["task", "Client case", s[2]]];

  app.innerHTML = `
    <a class="back" href="#home">← Learning track</a>
    <header class="mod-head">
      <p class="eyebrow">Module ${idx + 1} of ${MODULES.length} · ${m.minutes} min</p>
      <h1>${esc(m.title)}</h1>
      <p>${esc(m.summary)}</p>
    </header>
    <div class="tabs" role="tablist">
      ${tabs.map(([k, label, done]) => `
        <button type="button" role="tab" id="tab-${k}" aria-selected="${tab === k}" data-tab="${k}">
          <span class="tick ${done ? "on" : ""}" aria-hidden="true">${done ? "✓" : ""}</span>${label}
        </button>`).join("")}
    </div>
    <div id="panel" role="tabpanel" aria-labelledby="tab-${tab}"></div>`;

  app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    currentTab[id] = b.dataset.tab; renderModule(id);
  }));

  const panel = document.getElementById("panel");
  if (tab === "lesson") renderLesson(m, panel, idx);
  if (tab === "quiz") renderQuiz(m, panel);
  if (tab === "task") renderTask(m, panel, idx);
}

function sectionHTML(sec) {
  return `
    <section>
      ${sec.h ? `<h2>${esc(sec.h)}</h2>` : ""}
      ${(sec.p || []).map(p => `<p>${esc(p)}</p>`).join("")}
      ${sec.list ? `<ul>${sec.list.map(li => `<li>${esc(li)}</li>`).join("")}</ul>` : ""}
      ${sec.ex ? `<div class="callout example"><p class="eyebrow">${esc(sec.ex.label)}</p><pre class="code">${esc(sec.ex.code)}</pre></div>` : ""}
    </section>`;
}

function renderLesson(m, panel, idx) {
  const read = !!state.lessons[m.id];
  panel.innerHTML = `
    <article class="lesson">
      ${m.lesson.map(sectionHTML).join("")}
      <section class="takeaways">
        <p class="eyebrow">Key takeaways</p>
        <ul>${m.takeaways.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      </section>
      <div class="done-bar">
        ${read
          ? `<p>Lesson complete. +${XP.lesson} XP</p><button class="btn primary" type="button" id="to-quiz">Take the quiz</button>`
          : `<button class="btn primary" type="button" id="mark-read">Mark lesson as read</button><p>+${XP.lesson} XP, then test yourself in the quiz.</p>`}
      </div>
    </article>`;
  const mark = document.getElementById("mark-read");
  if (mark) mark.addEventListener("click", () => {
    state.lessons[m.id] = true; saveState(); toast(`Lesson complete · +${XP.lesson} XP`);
    currentTab[m.id] = "quiz"; renderModule(m.id); scrollTo({ top: 0 });
  });
  const toQuiz = document.getElementById("to-quiz");
  if (toQuiz) toQuiz.addEventListener("click", () => { currentTab[m.id] = "quiz"; renderModule(m.id); scrollTo({ top: 0 }); });
}

function renderQuiz(m, panel) {
  if (!quizSession || quizSession.id !== m.id) quizSession = { id: m.id, i: 0, picked: null, checked: false, results: [] };
  const qs = quizSession;
  const total = m.quiz.length;

  if (qs.i >= total) {
    const score = qs.results.filter(Boolean).length;
    const prev = state.quizBest[m.id] || 0;
    const passed = score >= Math.ceil(total * PASS_RATIO);
    panel.innerHTML = `
      <div class="quiz-card">
        <p class="eyebrow">Quiz result</p>
        <p class="score-big">${score}/${total}</p>
        <p>${passed ? "Passed. You have a solid grasp of this module." : `You need ${Math.ceil(total * PASS_RATIO)} correct to pass. Review the explanations and try again.`}</p>
        <p class="hint">Best score: ${Math.max(prev, score)}/${total} · each correct answer on your best attempt is worth ${XP.perCorrect} XP</p>
        <div class="btn-row">
          <button class="btn" type="button" id="retake">Retake quiz</button>
          ${passed ? `<button class="btn primary" type="button" id="to-task">Go to the client case</button>`
                   : `<button class="btn primary" type="button" id="to-lesson">Review the lesson</button>`}
        </div>
      </div>`;
    document.getElementById("retake").addEventListener("click", () => { quizSession = null; renderQuiz(m, panel); });
    const tt = document.getElementById("to-task");
    if (tt) tt.addEventListener("click", () => { currentTab[m.id] = "task"; renderModule(m.id); scrollTo({ top: 0 }); });
    const tl = document.getElementById("to-lesson");
    if (tl) tl.addEventListener("click", () => { currentTab[m.id] = "lesson"; renderModule(m.id); scrollTo({ top: 0 }); });
    return;
  }

  const q = m.quiz[qs.i];
  const letters = "ABCD";
  panel.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-top">
        <span class="eyebrow">Question ${qs.i + 1} of ${total}</span>
        <span class="dots" aria-hidden="true">${m.quiz.map((_, j) =>
          `<i class="${j < qs.results.length ? (qs.results[j] ? "ok" : "no") : j === qs.i ? "cur" : ""}"></i>`).join("")}</span>
      </div>
      <p class="q-text">${esc(q.q)}</p>
      <div class="options" role="group" aria-label="Answer options">
        ${q.o.map((opt, j) => {
          let cls = "";
          if (qs.checked) { if (j === q.a) cls = "correct"; else if (j === qs.picked) cls = "wrong"; }
          else if (j === qs.picked) cls = "selected";
          return `<button type="button" class="option ${cls}" data-opt="${j}" ${qs.checked ? "disabled" : ""} aria-pressed="${j === qs.picked}">
            <span class="key">${letters[j]}</span><span>${esc(opt)}</span></button>`;
        }).join("")}
      </div>
      ${qs.checked ? `
        <div class="feedback ${qs.picked === q.a ? "ok" : "no"}">
          <b>${qs.picked === q.a ? "Correct" : `Not quite. The answer is ${letters[q.a]}.`}</b>
          <p>${esc(q.e)}</p>
        </div>` : ""}
      <div class="btn-row">
        ${qs.checked
          ? `<button class="btn primary" type="button" id="next-q">${qs.i + 1 < total ? "Next question" : "See result"}</button>`
          : `<button class="btn primary" type="button" id="check-q" ${qs.picked == null ? "disabled" : ""}>Check answer</button>`}
      </div>
    </div>`;

  panel.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    qs.picked = Number(b.dataset.opt); renderQuiz(m, panel);
  }));
  const check = document.getElementById("check-q");
  if (check) check.addEventListener("click", () => {
    qs.checked = true; qs.results.push(qs.picked === q.a); renderQuiz(m, panel);
    document.getElementById("next-q").focus();
  });
  const next = document.getElementById("next-q");
  if (next) next.addEventListener("click", () => {
    qs.i++; qs.picked = null; qs.checked = false;
    if (qs.i >= total) {
      const score = qs.results.filter(Boolean).length;
      const prev = state.quizBest[m.id] || 0;
      if (score > prev) {
        state.quizBest[m.id] = score; saveState();
        toast(`New best score · +${(score - prev) * XP.perCorrect} XP`);
      }
      renderModule(m.id);
    } else renderQuiz(m, panel);
  });
}

function renderTask(m, panel, idx) {
  const t = m.task;
  const checks = state.checks[m.id] || [];
  const done = !!state.tasks[m.id];
  panel.innerHTML = `
    <div class="task">
      <div class="brief">
        <div class="client"><p class="eyebrow">Client brief</p><span class="tag">${esc(t.client)} · ${esc(t.role)}</span></div>
        <p>${esc(t.brief)}</p>
      </div>
      <section class="lesson" style="gap:10px">
        <h2>Your deliverables</h2>
        <p class="hint">Tick each item when your answer covers it.</p>
        <ul class="checklist">
          ${t.deliverables.map((d, j) => `
            <li><label for="chk-${m.id}-${j}">
              <input type="checkbox" id="chk-${m.id}-${j}" data-chk="${j}" ${checks[j] ? "checked" : ""}>
              <span>${esc(d)}</span></label></li>`).join("")}
        </ul>
      </section>
      <section class="lesson" style="gap:8px">
        <label for="draft-${m.id}"><h2>Your answer</h2></label>
        <textarea id="draft-${m.id}" placeholder="Write your recommendation as you would send it to the client. Bullet points are fine."></textarea>
        <p class="hint" id="draft-hint"></p>
      </section>
      <details class="model">
        <summary>Compare with a model answer</summary>
        <div class="lesson">${t.model.map(p => `<p>${esc(p)}</p>`).join("")}
          <p class="hint">A model answer is one good approach, not the only one. Check whether yours covers the same risks and gives the client a clear next step.</p>
        </div>
      </details>
      <div class="done-bar">
        ${done
          ? `<p>Case solved. +${XP.task} XP</p>${MODULES[idx + 1] ? `<a class="btn primary" href="#module-${MODULES[idx + 1].id}">Next module: ${esc(MODULES[idx + 1].title)}</a>` : `<a class="btn primary" href="#home">Back to the track</a>`}`
          : `<button class="btn primary" type="button" id="complete-task">Mark case as solved</button><p id="task-req"></p>`}
      </div>
    </div>`;

  const ta = document.getElementById(`draft-${m.id}`);
  ta.value = state.drafts[m.id] || "";
  const hint = document.getElementById("draft-hint");
  const btn = document.getElementById("complete-task");
  const req = document.getElementById("task-req");
  const MIN_CHARS = 150;

  function refresh() {
    const n = ta.value.trim().length;
    const allChecked = t.deliverables.every((_, j) => (state.checks[m.id] || [])[j]);
    hint.textContent = `${n} characters · saved in this browser`;
    if (btn) {
      btn.disabled = !(allChecked && n >= MIN_CHARS);
      req.textContent = btn.disabled
        ? (!allChecked ? "Tick every deliverable first." : `Write at least ${MIN_CHARS} characters.`)
        : `+${XP.task} XP`;
    }
  }
  ta.addEventListener("input", () => { state.drafts[m.id] = ta.value; saveState(); refresh(); });
  panel.querySelectorAll("[data-chk]").forEach(c => c.addEventListener("change", () => {
    const arr = state.checks[m.id] || [];
    arr[Number(c.dataset.chk)] = c.checked; state.checks[m.id] = arr; saveState(); refresh();
  }));
  if (btn) btn.addEventListener("click", () => {
    state.tasks[m.id] = true; saveState();
    toast(moduleDone(m) ? `Module complete · +${XP.task} XP` : `Case solved · +${XP.task} XP`);
    renderModule(m.id);
  });
  refresh();
}

/* ------------------------------------------------------------------
   Glossary
------------------------------------------------------------------- */
function renderGlossary() {
  app.innerHTML = `
    <header class="mod-head">
      <p class="eyebrow">${GLOSSARY.length} terms</p>
      <h1>Glossary</h1>
      <p>The vocabulary you will hear in client meetings, explained in one or two sentences.</p>
    </header>
    <label for="gloss-search" class="eyebrow">Search terms</label>
    <input id="gloss-search" class="search" type="search" placeholder="e.g. webhook, RAG, DPA">
    <dl class="gloss" id="gloss-list"></dl>`;
  const list = document.getElementById("gloss-list");
  const input = document.getElementById("gloss-search");
  function draw() {
    const q = input.value.trim().toLowerCase();
    const rows = GLOSSARY.filter(([t, d]) => !q || t.toLowerCase().includes(q) || d.toLowerCase().includes(q));
    list.innerHTML = rows.length
      ? rows.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")
      : `<p class="hint" style="padding-top:12px">No terms match "${esc(input.value)}".</p>`;
  }
  input.addEventListener("input", draw);
  draw();
}

/* ------------------------------------------------------------------
   Theme: follows the phone's setting until the user picks light or dark
------------------------------------------------------------------- */
const THEME_KEY = "ai-academy-theme";
const THEMES = ["system", "light", "dark"];
const THEME_LABEL = { system: "Theme follows your phone", light: "Light theme", dark: "Dark theme" };
const THEME_ICON = {
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"></path></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path></svg>'
};
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  return t === "light" || t === "dark" ? t : "system";
}
function applyTheme(t) {
  const root = document.documentElement;
  if (t === "system") delete root.dataset.theme; else root.dataset.theme = t;
  try { if (t === "system") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, t); } catch (e) {}
  const metas = document.querySelectorAll('meta[name="theme-color"]');
  metas.forEach(m => {
    const own = m.media.includes("dark") ? "#0f151b" : "#f3f5f7";
    m.content = t === "system" ? own : t === "dark" ? "#0f151b" : "#f3f5f7";
  });
  const btn = document.getElementById("theme-btn");
  const next = THEMES[(THEMES.indexOf(t) + 1) % THEMES.length];
  btn.innerHTML = THEME_ICON[t];
  btn.setAttribute("aria-label", `${THEME_LABEL[t]}. Switch to ${next === "system" ? "phone setting" : next + " theme"}`);
  btn.title = THEME_LABEL[t];
}
document.getElementById("theme-btn").addEventListener("click", () => {
  const next = THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length];
  applyTheme(next); toast(THEME_LABEL[next]);
});
applyTheme(currentTheme());

/* ------------------------------------------------------------------
   Router
------------------------------------------------------------------- */
function render() {
  const h = location.hash.replace("#", "");
  if (h.startsWith("module-")) { renderModule(h.slice(7)); updateChrome("module"); }
  else if (h === "glossary") { renderGlossary(); updateChrome("glossary"); }
  else { renderHome(); updateChrome("home"); }
}
window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); });
render();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
